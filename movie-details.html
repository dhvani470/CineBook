
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - CineBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">CineBook<span>.</span></a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="index.html#movies">Movies</a>
                <a class="nav-link" href="index.html#about">About</a>
            </div>
        </div>
    </nav>

    <!-- Movie Details -->
    <section class="container my-5 page-content">
        <a href="index.html#movies" class="back-link">&larr; Back to Movies</a>

        <div class="row g-4 mt-2 align-items-center">
            <div class="col-md-4">
                <img
                    src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
                    alt="Movie poster"
                    class="img-fluid details-poster">
            </div>

            <div class="col-md-8">
                <p class="details-label">MOVIE DETAILS</p>

                <h1 class="details-title">Movie Title One</h1>

                <p class="movie-meta">Drama | 2h 15m</p>

                <p>
                    Enjoy an exciting cinema experience with this movie.
                    Explore the story and get ready for your next movie night.
                </p>

                <p><strong>Language:</strong> Hindi</p>
                <p><strong>Genre:</strong> Drama</p>

                <a href="#" class="btn btn-book">Book Tickets</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer text-center">
        <p>&copy; 2026 CineBook. All rights reserved.</p>
    </footer>

</body>
</html>
