<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CineBook</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                CineBook<span>.</span>
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="movies.html">Movies</a>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <main class="page-content login-section">
        <div class="container">
            <div class="login-card">

                <h1>Create Account</h1>
                <p class="login-subtitle">
                    Join CineBook and get ready for your next movie.
                </p>

                <form id="registerForm">

                    <div class="mb-3">
                        <label for="fullName" class="form-label">
                            Full Name
                        </label>

                        <input type="text" class="form-control" id="fullName" name="fullName"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Create a password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>

                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="Re-enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-book w-100 mt-2">
                        Register
                    </button>

                </form>

                <p class="register-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center">
        <p>&copy; 2026 CineBook. All rights reserved.</p>
    </footer>

</body>

</html>
